[project]
name = "order_management_api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "uvicorn>=0.24.0",
]

[tool.fastapi]
entrypoint = "app.api.v1.endpoints.products:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]   